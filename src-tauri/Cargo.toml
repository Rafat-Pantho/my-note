[package]
name = "my-note"
version = "0.1.0"
description = "Fast, modern notepad"
edition = "2024"

[lib]
name = "my_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Startup timing (process creation time). Already in the dependency tree via tauri; no size cost.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
