<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>My Note</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="tint"></div>
    <div id="app">
      <div id="menubar">
        <div id="menus"></div>
        <span class="sp"></span>
        <button id="settingsbtn" class="tabbtn" title="Settings (Ctrl+,)" aria-label="Settings">&#9881;&#xFE0E;</button>
      </div>
      <div id="tabbar">
        <div id="tabs"></div>
        <button id="newtab" class="tabbtn" title="New tab (Ctrl+N)">+</button>
        <span class="sp"></span>
        <button id="aibtn" class="tabbtn" title="AI actions (Ctrl+I)">AI</button>
      </div>
      <div id="extbar" hidden></div>
      <div id="work"><div id="editor"></div></div>
      <div id="settings" hidden></div>
      <div id="statusbar"></div>
    </div>
    <pre id="print"></pre>
  </body>
</html>
